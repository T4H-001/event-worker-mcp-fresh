services:
  event-worker-mcp:
    build: .
    container_name: t4h-event-worker-mcp-fresh
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - event_worker_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8081),2);s.close()"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  event_worker_data:
    name: t4h_event_worker_mcp_fresh_data
